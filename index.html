<title>낙성 미니홈피 꾸미기 체험</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Silkscreen&display=swap"><style id="css">
/* Layout: a two-page binder (profile page | room page) with index tabs on the right; stacks to one column on phones */
:root{
  --sky:#fbe4ec; --sky-dot:#f6d0dd; --paper:#ffffff; --book:#fff2f6;
  --line:#efaec2; --lav:#f2b8cb; --blue:#c2537a; --blue-d:#9e3c5f; --tab:#e88aa6;
  --pink:#c0285c; --pink-s:#e8507f; --pink-bg:#fff7fa; --pink-line:#f2b9ca;
  --ink:#374151; --muted:#6b7280; --yel:#fff3c4; --yel-line:#f1d98a; --yel-ink:#6b4e00;
  --new:#c0392b; --ring:#d9a3b4; --soft:#fff6f9; --soft-line:#f1bfd0; --focus:#fffbe6;
  --ui:'Gulim','굴림','Dotum','돋움','Nanum Gothic','Apple SD Gothic Neo',sans-serif;
  --pix:'Silkscreen','Courier New',monospace;
  color-scheme:light;
}
body{background-color:var(--sky);background-image:radial-gradient(var(--sky-dot) 1px,transparent 1px);background-size:8px 8px;color:var(--ink);font-family:var(--ui)}
*{box-sizing:border-box}
button,input,textarea{font-family:inherit;font-size:12px;color:var(--ink)}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{display:flex;align-items:flex-start}
.book{flex:1;min-width:0;border:2px solid var(--line);border-radius:14px;background:var(--book);padding:14px;display:flex;flex-direction:column;gap:8px}
.tabs{flex:none;width:36px;display:flex;flex-direction:column;gap:4px;padding-top:52px}
.tab{width:34px;padding:9px 0;border:none;border-radius:0 6px 6px 0;background:var(--tab);color:#fff;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:1px;font-size:11px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--paper);color:var(--blue);font-weight:700;border:2px solid var(--line);border-left:none}
.top{display:grid;grid-template-columns:200px 16px minmax(0,1fr);align-items:end;min-height:30px}
.count{font-family:var(--pix);font-size:11px;color:#4b5563;letter-spacing:.5px}
.count .t{color:var(--pink)} .count .o{color:var(--blue)} .count .bar{color:#9aa3b2}
.titlebar{grid-column:3;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.titlebar h1{margin:0;font-size:17px;font-weight:800;color:var(--blue);letter-spacing:-.3px;text-wrap:balance}
.titlebar h1 .hrt{color:var(--pink-s)}
.url{font-size:11px;color:var(--muted);word-break:break-all}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.status{font-size:11px;color:var(--muted)}
.btn{height:24px;padding:0 10px;border:1px solid var(--line);background:#ffe9f0;color:var(--blue);border-radius:4px;cursor:pointer}
.btn:hover{background:#ffdce8}
.btn.on{background:var(--pink-s);border-color:var(--pink);color:#fff}
.hint{font-size:12px;color:var(--yel-ink);background:var(--yel);border:1px solid var(--yel-line);border-radius:6px;padding:6px 10px}
.pages{display:grid;grid-template-columns:200px 16px minmax(0,1fr);align-items:stretch}
.card{background:var(--paper);border:2px dashed var(--lav);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.rings{display:flex;flex-direction:column;justify-content:space-evenly;align-items:center}
.rings span{width:18px;height:6px;border-radius:3px;background:var(--ring)}
.lbl{margin:0;font-family:var(--pix);font-weight:400;font-size:11px;color:var(--blue);letter-spacing:.5px}
.lbl.pk{color:var(--pink)}
.lbl.rule{border-bottom:1px dotted var(--soft-line);padding-bottom:4px}
.mood{align-self:flex-start;background:var(--yel);border:1px solid var(--yel-line);border-radius:10px;padding:3px 9px;font-size:12px;color:var(--yel-ink);margin:0}
.pic{height:170px;border:1px solid var(--soft-line);border-radius:6px;display:flex;align-items:center;justify-content:center;background:#fff5f8}
.pic svg{width:150px;height:108px;image-rendering:pixelated}
.prof{flex:1;display:flex;flex-direction:column;gap:6px;border-top:1px dotted var(--lav);border-bottom:1px dotted var(--lav);padding:10px 0}

.hist{display:flex;flex-direction:column;gap:7px}
.hlink{display:flex;align-items:center;gap:7px;font-size:12px;background:none;border:none;padding:0;color:var(--blue);cursor:pointer;text-align:left}

.bgm{border:1px solid var(--soft-line);border-radius:6px;background:var(--soft);padding:8px;display:flex;flex-direction:column;gap:6px}
.song{font-size:12px;overflow-wrap:anywhere}
.bgm-in{width:100%;height:28px;border:1px dashed var(--pink-s);border-radius:3px;padding:0 6px;background:var(--paper)}

.bgm-tools{display:flex;gap:6px;flex-wrap:wrap}

.bgm-link{font-size:11px;white-space:nowrap}

.has-audio .prog i{animation:none!important;transition:width .25s linear}
.prog{height:4px;background:#f6dbe4;border-radius:2px;overflow:hidden}
.prog i{display:block;width:38%;height:4px;background:var(--pink-s);border-radius:2px}
.playing .prog i{animation:prog 12s linear infinite}
@keyframes prog{from{width:0}to{width:100%}}
@media (prefers-reduced-motion:reduce){.playing .prog i{animation:none;width:60%}}
.ctl{display:flex;gap:4px;align-items:center}

.news{display:flex;gap:14px;flex-wrap:wrap}
.news ul{flex:1 1 220px;min-width:0;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12px}

.news li time{margin-left:auto;flex:none;font-family:var(--pix);font-size:10px;color:var(--muted)}
.nb{flex:none;font-family:var(--pix);font-size:9px;line-height:1;color:#fff;background:var(--new);border-radius:3px;padding:2px 3px}
.cnt button{background:none;border:none;padding:0;text-align:left;color:#4b5563;cursor:pointer;font-size:12px}
.cnt button:hover{text-decoration:underline}
.news li button:hover{text-decoration:underline}
.news .k{color:var(--blue)}
.news .empty{color:var(--muted)}
.cnt{flex:0 0 170px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 10px;font-size:12px;color:#4b5563;border-left:1px dotted var(--soft-line);padding-left:12px;font-variant-numeric:tabular-nums;align-content:start}
.cnt b{color:var(--new)}
.rowhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rname{font-size:11px;color:var(--muted)}
.rname .hrt{color:var(--pink-s)}
.room{border:1px solid #f1c6d4;border-radius:4px;overflow:hidden}

.diary{display:flex;flex-direction:column;gap:10px}

.mrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%}
.mhint{font-size:11px;color:var(--muted)}
.mprev{display:flex;gap:6px;flex-wrap:wrap;width:100%}

.pv{position:relative;width:72px;height:72px}
.pv img,.pv video{width:72px;height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--soft-line)}
.pv .x{position:absolute;top:2px;right:2px;margin:0}
.mlab{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#4b5563}
.rsv{flex:none;font-family:var(--pix);font-size:9px;line-height:1;color:#fff;background:var(--blue);border-radius:3px;padding:3px 4px}
.post.reserved{border-style:dashed;background:#fffafc}
.pedit{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pedit input{height:24px;border:1px solid var(--soft-line);border-radius:3px;padding:0 5px;background:var(--paper);font-size:11px}
.post p{margin:0;font-size:12px;line-height:1.7;white-space:pre-line;overflow-wrap:anywhere}
.guest{display:flex;gap:10px;align-items:flex-start;border-bottom:1px dotted var(--soft-line);padding-bottom:10px}

.ed{border-radius:2px}
.editing .ed[contenteditable]{outline:1px dashed var(--pink-s);outline-offset:2px;cursor:text}

.ppage{display:flex;flex-direction:column;gap:14px}
.pbig{border:1px solid var(--soft-line);border-radius:6px;display:flex;align-items:center;justify-content:center;padding:18px 8px;background:#fff5f8}

.pinfo{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ppage .head{font-size:18px}

.roombox{position:relative}
.room{touch-action:pan-y;user-select:none;-webkit-user-select:none}

.rnav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:38px;border:1px solid var(--line);background:rgba(255,255,255,.85);color:var(--blue);border-radius:6px;cursor:pointer;font-size:12px;padding:0;line-height:1}

var LIMIT=14*1024*1024;
function shrinkImage(file){return new Promise(function(res,rej){
  if(file.type==='image/gif'&&file.size<1.5*1024*1024){var r=new FileReader();r.onload=function(){res(String(r.result))};r.onerror=rej;r.readAsDataURL(file);return}
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){var max=1280,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.82))};
  img.onerror=function(){URL.revokeObjectURL(url);rej()};img.src=url;})}
function readVideo(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result))};r.onerror=rej;r.readAsDataURL(file)})}
function addMedia(files){
  var list=Array.prototype.slice.call(files||[]);if(!list.length)return;setStatus('사진·영상 준비 중…');
  var chain=Promise.resolve();
  list.forEach(function(f){chain=chain.then(function(){
    var isVid=/^video\//.test(f.type),isImg=/^image\//.test(f.type);
    if(!isVid&&!isImg){setStatus('사진이나 영상 파일만 넣을 수 있어요');return}
    if(isVid&&f.size>6*1024*1024){setStatus('영상이 너무 커요. 6MB 이하로 넣어 주세요');return}
    return (isVid?readVideo(f):shrinkImage(f)).then(function(src){
      var used=pending.reduce(function(a,x){return a+x.src.length},0);
      if(pageSize(used+src.length)>LIMIT){setStatus('페이지 용량이 꽉 찼어요. 오래된 사진·영상을 지워 주세요');return}
      pending.push({t:isVid?'vid':'img',src:src});drawPrev();setStatus('');
    },function(){setStatus('파일을 읽지 못했어요')});
  })});
}
